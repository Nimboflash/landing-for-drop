  # -----------------------------------------------------------------------
  # Entry 3 — Security-veto clearance. VETOED, with a required alternative
  # (ADR-0004 in decision-log.yaml). Illustrates the one deliberate
  # authority asymmetry: cto/orchestrator cannot overrule this entry.
  # -----------------------------------------------------------------------
  - schema_version: 1
    id: APR-0003
    subject: "Sensitive-data boundary: raw device-level location fields in partner loan-tape ingestion payloads"
    requested_by: backend-engineer
    approver: security-engineer
    approval_type: security_veto_clearance
    status: vetoed
    conditions: []
    veto:
      vetoed: true
      rationale: >
        Precise device-level location in loan-tape ingestion payloads
        exceeds the project's declared sensitive-data boundary and creates
        an unauthorized secondary data-collection surface under the
        "unlicensed centralization is illegal" constraining fact.
      offered_alternative: >
        Accept only partner-declared, coarse (city-level or coarser)
        geography fields; derive nothing finer server-side; do not transmit
        or store device GPS coordinates at all.
    evidence_refs:
      - "decision-log.yaml#ADR-0004"
      - "contract-registry.yaml#contract-partner-api#validation_rules"
      - "shared-context.yaml#security-requirements"
    timestamp: "2026-07-12T16:45:00Z"
    classification: Recommended
    notes: >
      Illustrative instance. The VETO AUTHORITY itself — scoped to one
      question, unoverridable by cto, must ship with an alternative,
      recorded as a decision/ADR — is Extracted (design-spine §3.5,
      evidence-digest cross-cutting caveats: "the one deliberate asymmetry
      to preserve"). This specific subject/rationale is invented to
      demonstrate the pattern; it mirrors decision-log.yaml's ADR-0004
      exactly, since every veto is recorded as an ADR per that rule.
      TERMINALITY: no future approval instance with approver == cto or
      approver == orchestrator may flip this subject's status to
      approved/approved_with_conditions — only a new licensed/jurisdiction-
      cleared agreement (a human-approved exception per the
      human_approval_required list) or adoption of the offered_alternative,
      recorded separately, may move this forward.

