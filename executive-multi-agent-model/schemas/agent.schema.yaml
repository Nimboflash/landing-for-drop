# =============================================================================
# agent.schema.yaml
# -----------------------------------------------------------------------------
# Purpose: Defines one role in the Virtual Software Organization (VSO) — an
#   agent, gate, workflow, or human actor with a stable canonical_id. Every
#   file in this framework that names an owner, approver, reviewer, or
#   escalation target uses an id defined by an instance of this schema.
#
# schema_version: 1
#
# provenance: Inferred/partially-extracted
#   The source repository had 10 real agent files (uniform Identity/Scope/
#   Phase/Non-negotiables/DoD/Escalation shape for 9 of them; credit-architect
#   was a structural outlier — see evidence digest §10). That real shape
#   (Extracted) gives us: mission, responsibilities, decision boundaries
#   ("owns"/"never touches"), escalation routing, definition_of_done. What
#   the source did NOT have, at all, in any agent file: a `tools:` key or a
#   `permissions:` key in any frontmatter (evidence digest #25 — "no
#   per-agent tool restrictions... permissions normative only"). Every real
#   agent had full, unscoped tool access; restraint was cultural instruction
#   ("stay in your lane"), never enforced access control. That was a real
#   gap, not a design choice. `tools` / `permissions` / `restrictions` below
#   are therefore Recommended technical scoping — formalizing what the
#   source only ever said in prose. `veto_authority` and `escalation_paths`
#   are Extracted for security-engineer's one scoped veto and Partially
#   extracted (formalized shape) for everyone else's routing.
#
# Related schemas: quality-gate.schema.yaml, task.schema.yaml,
#   approval.schema.yaml, review.schema.yaml
# =============================================================================

fields:
  canonical_id: security-engineer      # string | required | kebab-case, STABLE, referenced by every
                                        #   other schema (owner_agent, approver, reviewer_agent, etc.)

  canonical_name: "Security Engineer"  # string | required | human-readable display name

  original_names:                      # array<string> | optional | source-repo filename(s)/role
    - "security-architect"             #   this canonical_id was renamed from, if any (see design-
                                        #   spine §2 rename table). Empty for roles with no source name.

  aliases:                             # array<string> | optional | other names this role has been
    - "security-architect"             #   called across framework docs/examples; kept for search/
    - "appsec"                         #   cross-reference, never used as the field value elsewhere

  classification: explicit_primary_agent
                                        # string | required | enum:
                                        #   explicit_primary_agent | explicit_subagent |
                                        #   implicit_agent_like_role | supervisory_agent |
                                        #   specialist_agent | workflow_automation | review_gate |
                                        #   approval_gate | human_operated_role | deprecated_role |
                                        #   experimental_role | recommended_addition | unverified_role

  lifecycle_status: active             # string | required | enum: active | conditional | deprecated |
                                        #   replaced | experimental | unverified | recommended

  project_types:                       # array<string> | required | which of the 10 activation-matrix
    - minimal                          #   profiles (design-spine §13) this role is active in; the
    - standard                         #   always-on core (orchestrator, product-manager, cto,
    - high_risk                        #   backend-engineer, qa-engineer, security-engineer, code-
    - regulated                        #   reviewer, human-owner) lists ALL profiles here
    - infrastructure_heavy
    - frontend_only
    - backend_only
    - mobile
    - data_or_ai

  versions:                            # array<string> | optional | schema/definition versions this
    - "1.0"                            #   agent definition has gone through; NOT a task/project version

  mission: >                           # string | required | one-line self-concept + bias, matching
    Security, privacy, and compliance authority for the project. Holds the
    one scoped veto over the sensitive-data boundary. Discipline: say no
    early, and never say no without an alternative.
                                        #   the source's "identity-first agent" pattern (evidence
                                        #   digest §4): a one-line self-concept encoding bias, not a
                                        #   generic job description

  responsibilities:                    # array<string> | required | what this agent owns and does
    - "Reviews the data/compliance surface of every task before it is built"
    - "Defines and maintains the sensitive-data boundary for the project"
    - "Signs off on security_requirements attached to tasks"
    - "Owns the security_review task state and quality-gate outcomes it gates"
    - "Records every veto as an approval.schema.yaml instance with an alternative"

  decision_authority:                  # array<string> | required | question types this agent is the
    - "May we legally collect/process this data category?"
                                        #   OWNER of (per design-spine §4 decision matrix), phrased as
    - "Does this design cross the sensitive-data boundary?"
                                        #   the question pattern it answers

  prohibited_actions:                  # array<string> | required | explicit negative scope — the
    - "Does not set product scope or priority"
                                        #   source's "You do not own" / "Never touches" pattern
    - "Does not author domain/business policy thresholds"
    - "Does not approve its own findings as satisfied without independent re-check"
    - "Cannot be overruled on its one scoped veto by cto or orchestrator"

  inputs:                              # array<string> | required | what this agent consumes
    - "task.security_requirements"
    - "contract.data_ownership"
    - "shared-context.security-requirements"

  outputs:                             # array<string> | required | what this agent produces
    - "review.schema.yaml instances (review_type: security)"
    - "approval.schema.yaml instances (approval_type: security_veto_clearance)"
    - "quality-gate.schema.yaml results for the security-review gate"

  tools: []                            # array<string> | recommended | e.g. ["static-analysis-scanner",
                                        #   "dependency-vuln-scanner", "secret-scanner"]. RECOMMENDED
                                        #   FIELD — see provenance note above: the source granted every
                                        #   agent full, unscoped access with no tools: key at all. An
                                        #   empty list here means "not yet scoped," not "no tools needed."

  permissions:                         # object | recommended | technical access scoping. RECOMMENDED —
    read: ["**"]                       #   see provenance note: the source had no permissions: key
    write: ["docs/security/**", "ADR/**"]
    approve_gates: ["security-review"]

  restrictions:                        # array<string> | recommended | hard technical denylist, distinct
    - "no write access to src/**/domain/** (review-only, not implementation)"
                                        #   from prohibited_actions (which is a normative/cultural rule,
                                        #   not an access control). RECOMMENDED — formalizes what the
                                        #   source enforced only via review, never via access control.

  parent_or_supervisor: null            # string | optional | canonical_id of a supervisory_agent this
                                        #   role reports to for temporal/scheduling purposes only (NOT
                                        #   decision authority — see supervisory_agent classification).
                                        #   null for peer authority-holders like security-engineer.

  receives_work_from:                  # array<string> | optional | canonical_ids that hand off TO
    - orchestrator                     #   this agent (task assignment / review request dispatch)
    - cto

  sends_work_to:                       # array<string> | optional | canonical_ids this agent hands
    - orchestrator                     #   off TO (results, findings, veto records)
    - cto
    - human-owner

  supported_message_types:             # array<string> | required | subset of the 19 canonical message
    - review_request                   #   types (design-spine §5) this agent sends/receives
    - review_result
    - approval_request
    - approval_response
    - escalation
    - blocker_report

  handoff_requirements:                # array<string> | optional | what this agent requires present
    - "security_requirements populated on the task before security_review starts"
                                        #   in an incoming handoff.schema.yaml before accepting it
    - "contract.data_ownership resolved for any task touching sensitive data"

  review_responsibilities:             # array<string> | optional | review_type(s) from
    - "security"                       #   review.schema.yaml this agent is qualified to render

  escalation_path:                     # array<string> | required | ladder for THIS agent's OWN
    - cto                              #   unresolved questions, ending at human-owner (design-spine §4)
    - human-owner

  definition_of_done:                  # array<string> | required | DoD for this agent's own work
    - "Every sensitive-data-boundary question has an explicit answer before implementation starts"
    - "Every veto is recorded as an approval instance with rationale and offered_alternative"
    - "No task with unresolved security_requirements reaches release_ready"

  activation_conditions:               # array<string> | optional | when this role turns on (beyond
    - "task.security_requirements is non-empty"
                                        #   project_types membership) — e.g. path-scoped or trigger-
    - "contract touches an authentication/authorization or sensitive-data surface"
                                        #   scoped activation, mirroring the source's path-scoped rules

  deactivation_conditions:             # array<string> | optional | when a conditional/experimental
    - "n/a — security-engineer is always-on core; see qa-engineer for a conditional example"
                                        #   role is retired or stood down for a project

  veto_authority:                      # object | required (present, may be empty) | the source's ONE
    scope: >                           #   distinctive extracted pattern (evidence digest, cross-
      Whether a design crosses the defined sensitive-data / legal-compliance
      boundary for this project (exactly one existential-compliance question,
      named per-project — see design-spine §3.5). Nothing else.
    who_cannot_overrule:               #   cutting caveats): scoped to exactly one question, cannot be
      - cto                            #   overruled by the arbiter, must ship with an alternative,
      - orchestrator                   #   recorded as a decision/ADR. See approval.schema.yaml.
      - human-owner                    #   (for the veto itself — a human MAY separately approve a
                                        #   documented exception; that is a distinct recorded action
                                        #   from overruling the veto in place. See design-spine §3.8.)

  escalation_paths:                    # array<object> | required | routing table entries this agent
    - question_pattern: "May we collect/store this data category at all?"
      target_agent: security-engineer  #   OWNS (design-spine §4 escalation ladders) — question-pattern
    - question_pattern: "Critical security issue found in production"
      target_agent: security-engineer  #   to named-owner routing, never hierarchy-based
    - question_pattern: "Security disagrees with cto on a boundary call"
      target_agent: cto
    - question_pattern: "Unresolved after cto"
      target_agent: human-owner

  evidence_refs:                       # array<string> | required | citations per design-spine §1
    - "EXT/03-agent-inventory.md"      #   evidence-ref convention
    - "repo:.claude/agents/security-architect.md"
    - "evidence-digest.md#12a"

  confidence: high                     # string | required | enum: high | medium | low

# --- notes ---
# A linter validating agent.schema.yaml instances SHOULD enforce:
#   1. `canonical_id` is kebab-case, unique across the whole roster, and matches the
#      spelling used everywhere else it's referenced (task.owner_agent, task.approver,
#      review.reviewer_agent, approval.approver, etc.) — no ad-hoc synonyms.
#   2. `classification` is one of the 13 enum values listed above; `lifecycle_status`
#      is one of: active, conditional, deprecated, replaced, experimental, unverified,
#      recommended.
#   3. If `classification` == recommended_addition, `evidence_refs` MUST still be
#      populated (with the rationale/evidence for the recommendation) — provenance
#      discipline applies even to recommendations (design-spine §3.11): never present
#      a Recommended role as if it existed in the source.
#   4. `veto_authority.who_cannot_overrule` is non-empty only if this agent actually
#      holds a veto; per design-spine §3.5 there is exactly ONE scoped veto in the
#      canonical framework (security-engineer). Any other agent instance claiming a
#      non-empty veto_authority.scope should be flagged for human review — vetoes
#      multiply into obstruction if not kept rare and scoped.
#   5. `escalation_paths[].target_agent` MUST resolve to an existing canonical_id (or
#      "human-owner"); a question_pattern with no resolvable target is an
#      organizational bug (design-spine §4).
#   6. `parent_or_supervisor`, if set, must point to an agent whose classification is
#      supervisory_agent — supervision is temporal/scheduling only, never a grant of
#      decision authority over the supervised agent's owned questions.
#   7. `tools` / `permissions` / `restrictions` are OPTIONAL to populate but the keys
#      themselves should always be present (even if empty) — their absence silently
#      reproduces the source's real gap (evidence digest #25) rather than flagging it.
#   8. `confidence` is one of: high, medium, low (design-spine §1).
