# The standing regression suite — ticket 18's seventh criterion.
#
# "The battery is registered as the standing regression suite, run on every subsequent pipeline
# ticket, not only at the validation gate." That is a claim about the development process rather than
# about a run's stage ordering, and until this file existed the only mechanical repetition in the
# project was somebody remembering to type pytest.
#
# Ordering, and it is the whole design of this file
# ------------------------------------------------
#
# The cheap named checks run first and the full suite last, because the full suite is slow for a
# specific reason: `tests/mutations` copies the tree and runs pytest in a **subprocess** once per
# mutation, so 113 mutations are ~226 cold interpreter starts. Locally that hides inside six minutes
# because __pycache__ is warm; on a fresh runner it is not, and it dominates the job.
#
# So the battery and the structural checks — seconds each — go first. A tree that is broken in the
# ways that matter most fails in under a minute instead of after half an hour, and the failure says
# which check failed rather than showing one red dot among three and a half thousand.
#
# There is deliberately **no separate mutation step**. `pytest` collects tests/mutations already, and
# a named step for it would run the most expensive thing in the project twice for nothing but a
# label.
#
# 3.9 is not a default that drifted here: pyproject sets requires-python >=3.9 and the tree is
# written to it — no `|` unions, no `list[str]`. A job on a later interpreter would pass while
# hiding that, and the failure would land on the machine that actually has 3.9.

name: suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded push has nothing left to prove; cancel it rather than paying for both.
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    # Generous, and measured rather than guessed: the mutation battery is ~226 subprocess pytest
    # runs from a cold cache. Six minutes warm locally is not the number this job will see.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Known-answer battery
        # Sixteen frozen cases, 100% required, no waiver and no "known edge case" state. §9.3 admits
        # no exception, so this must not be permitted to continue on error.
        run: python -m pytest tests/known_answer -q

      - name: Structural checks
        # The checks whose failure means the architecture moved rather than that a number changed:
        # the lane graph, shared purity, the post-T0 barrier, the signature barrier, the frozen
        # numeric context, and the pre-registration document against the freeze it records.
        run: |
          python -m pytest \
            tests/test_lane_independence.py \
            tests/test_shared_purity.py \
            tests/test_post_t0_barrier.py \
            tests/test_signature_barrier.py \
            tests/test_frozen_context.py \
            tests/test_preregistration_document.py \
            tests/test_standing_regression_suite.py \
            -q

      - name: Full suite
        # Everything, including the mutation battery. Every mutation must still be killed by the
        # tests that claim to kill it, and every anchor must still match the source it patches — a
        # mutation whose anchor moved is silently never applied, which a suite reports as a kill
        # while having done nothing.
        run: python -m pytest -q
