function block(fam, weight, text, px, chM, ls, lh, containerPx){
  const c=document.createElement('div'); c.className='probe'; c.style.width=containerPx+'px';
  const d=document.createElement('div');
  d.style.cssText='font-family:'+fam+';font-weight:'+weight+';font-size:'+px+'px;line-height:'+lh+';letter-spacing:'+ls+';max-inline-size:min(100%,'+chM+'ch);direction:rtl;text-wrap:balance';
  d.textContent=text; c.appendChild(d); document.body.appendChild(c);
  const r=d.getBoundingClientRect(); const n=Math.round(r.height/(px*lh)); const w=+r.width.toFixed(0);
  c.remove(); return n+'L/'+w+'px';
}
function chpx(fam,weight,px){const s=document.createElement('span');s.className='probe';s.style.cssText='font-family:'+fam+';font-weight:'+weight+';font-size:'+px+'px';s.textContent='0';document.body.appendChild(s);const w=s.getBoundingClientRect().width;s.remove();return +w.toFixed(2);}
function ink(fam,weight,text,px){const c=document.createElement('canvas').getContext('2d');c.font=weight+' '+px+'px '+fam;const m=c.measureText(text);return {w:+m.width.toFixed(1),asc:+m.actualBoundingBoxAscent.toFixed(1),desc:+m.actualBoundingBoxDescent.toFixed(1)};}
(async()=>{
  for (const f of ['400 48px K','700 48px K','400 48px V','700 48px V']) { try{ await document.fonts.load(f, S.title); }catch(e){} }

  o.push('=== 1440px viewport: display-lg=77.76px, container 1184px, lh1.15, ls -0.01em ===');
  for(const ch of [10,11,12,13,14,15,16,17]){

    o.push(row);

  for(const ch of [10,12,13,14,17]){
    let row='  '+ch+'ch: ';

    o.push(row);
  }
  o.push('=== .title 34.56px @1440 / 20ch / lh1.24 / container 1184 ===');
  for(const fam of ['K','V']) o.push('  '+fam+' '+block(fam,700,S.title,34.56,20,'-0.015em',1.24,1184));
  o.push('=== .statement 19.44px @1440 / 54ch / lh1.9 ===');
  for(const fam of ['K','V']) o.push('  '+fam+' thesis '+block(fam,700,S.thesis,19.44,54,'normal',1.9,1184)+'  notThis '+block(fam,400,S.notThis,19.44,54,'normal',1.9,1184));
  o.push('=== mobile 375px: title-lg=2rem=32px / 24ch / lh1.2, container 327px ===');
  for(const fam of ['K','V']) o.push('  '+fam+' msg3 '+block(fam,700,S.msg3,32,24,'-0.01em',1.2,327)+'  msg1 '+block(fam,700,S.msg1,32,24,'-0.01em',1.2,327));
  document.getElementById('out').textContent=o.join('\n');
})();
